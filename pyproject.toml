[project]
name = "albsat"
version = "0.1.0"
description = "Binance Spot pattern analizi, al-sat önerisi ve kontrollü otomatik işlem uygulaması"
requires-python = ">=3.12,<3.15"
license = { text = "Proprietary" }

# Sürümler bilinçli olarak alt sınırla sabitlenmiştir; kesin sürümler
# requirements.lock dosyasında tutulur (SPEC.md §5: "Bağımlılık sürümleri
# sabitlensin").
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15.0",
  # Python'ı işletim sisteminin güven deposuna bağlar; sertifika
  # doğrulamasını KAPATMADAN kurumsal/antivirüs kök sertifikalarını çözer.
  "truststore>=0.9",
  # Faz 3 arayüzü: yalnızca 127.0.0.1'e bağlanan yerel sunucu.
  # "uvicorn[standard]" DEĞİL: uvloop/httptools derleme gerektirir ve
  # Mac'te kurulumu kırabilir. Arayüzün kendisi WebSocket kullanmıyor.
  "fastapi>=0.115",
  "uvicorn>=0.30",
  # Faz 4: Binance canlı piyasa akışına (WebSocket) bağlanan istemci.
  # Saf Python; derleme gerektirmez.
  "websockets>=13",
  # Faz 4: komisyon ölçümü için Ed25519 imzası (yalnızca okuma istekleri).
  # Mac'te hazır derlenmiş paket (wheel) olarak kurulur.
  "cryptography>=43",
  # Emir gönderimi Faz 5'te eklenecek:
  # binance-connector DEĞİL — PyPI'da resmen "deprecated".
  # "binance-sdk-spot>=11.3.0",
]

[project.optional-dependencies]
# httpx: FastAPI TestClient bunu kullanır (arayüz uçlarının testi).
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]

[project.scripts]
albsat-fizibilite = "albsat.cli.feasibility:main"
albsat-oruntu = "albsat.cli.research:main"
albsat-tls-teshis = "albsat.cli.tlsteshis:main"
albsat-arayuz = "albsat.cli.serve:main"
albsat-telegram = "albsat.cli.telegram:main"
albsat-anahtar = "albsat.cli.anahtar:main"
albsat-demo = "albsat.cli.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/albsat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/albsat"]
