# Varsayılan yapılandırma. Tüm limitler arayüzden değiştirilebilir;
# buradaki değerler temkinli başlangıç noktalarıdır (SPEC.md §4.6).

mod: sadece_oneri        # kapali | sadece_oneri | kagit | demo | yari_otomatik | tam_otomatik

butce:
  # Doğrulama bütçesi. Bot yalnızca bu tutarı kullanır; hesabın kalanına
  # dokunmaz. Faz 6'ya kadar artırılmaz.
  toplam_usdt: "100"
  # DİKKAT (FAZ0-MIMARI.md Risk #2): 100 USDT bütçe ile dar stoplarda
  # (%0,3 ve altı) "işlem başı %0,5-1 risk" kuralı uygulanamaz; bütçe
  # bağlayıcı olur. Risk motoru her öneride hangisinin bağladığını gösterir.

risk:
  # Faz 4: bu bölümdeki her değer arayüzden değiştirilebilir ve değişiklik
  # veri/albsat.sqlite3 içinde saklanır. Buradaki değerler
  # albsat.risk.limits.RiskLimits varsayılanlarıyla aynıdır;
  # tests/test_risk_motoru.py ikisinin ayrışmadığını denetler.
  islem_basi_risk_yuzde: "1.0"
  gunluk_max_zarar_yuzde: "3.0"
  haftalik_max_dusus_yuzde: "6.0"
  aylik_max_dusus_yuzde: "10.0"
  art_arda_kayip_limiti: 4
  kayip_sonrasi_soguma_mum: 2
  max_es_zamanli_pozisyon: 1
  coin_basi_max_maruziyet_yuzde: "100"
  gunluk_max_islem: 20
  # Piyasa koşulu filtreleri (SPEC §4.6): bunlardan biri kapalıysa yeni
  # işlem açılmaz. Ölçülemeyen koşul "geçti" sayılmaz.
  # Fiyat WebSocket akışıyla saniyede bir gelir; akış koparsa yedek REST
  # yoklaması dakikada birdir. 180 saniye ikisini de kapsar.
  bayat_veri_azami_saniye: 180
  volatilite_kati: "3"
  spread_kati: "5"
  spread_azami_yuzde: "0.10"
  min_24s_hacim_usdt: "5000000"
  btc_sert_hareket_yuzde: "3.0"
  # Performans bozulma koruması: kural en az bu kadar kâğıt işlemden sonra
  # beklentisiyle kıyaslanır; bu kadar standart hata altındaysa durdurulur.
  performans_min_islem: 10
  performans_z_esigi: "2.33"

maliyet:
  # Sinyal eleme eşiğinin bileşenleri (yüzde)
  beklenen_spread_yuzde: "0.01"
  beklenen_kayma_yuzde: "0.02"
  guvenlik_payi_yuzde: "0.05"
  bnb_ile_ode: false

emir:
  giris_tipi: LIMIT_MAKER
  stop_tipi: STOP_LOSS          # tetiklenince piyasa emri (taker komisyonu)
  yeniden_fiyatlama_denemesi: 3  # ORDERS rate limit'i yakmamak için düşük
  # Kısmi dolumda pozisyon borsada korumasız kalır (FAZ0-MIMARI.md Risk #1).
  # Bu süre dolunca kalan iptal edilir ve dolan miktar için hemen OCO kurulur.
  korumasiz_azami_saniye: 20

veri:
  periyotlar: ["1m", "5m", "15m", "1h"]
  semboller: ["BTCUSDT", "SOLUSDT"]
  gecmis_gun: 730
  gecmis_gun_1m: 180

guvenlik:
  # Anahtarda para çekme izni açıksa uygulama başlamayı reddeder.
  cekim_izni_varsa_calisma: true
  arayuz_yalnizca_yerel: true
